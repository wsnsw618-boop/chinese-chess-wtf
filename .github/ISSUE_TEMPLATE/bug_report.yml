name: Bug report
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可复现步骤；如果是规则问题，请附上局面和走法。
  - type: input
    id: version
    attributes:
      label: 版本/提交
      description: 例如 v1.0.0，或 git commit 的前 7 位
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 模式
      options:
        - 双人对战
        - 人机对战（执红）
        - 人机对战（执黑）
        - 规则书/文档
        - 构建/开发
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器与系统
      placeholder: Edge 141 / Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 看到...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: 控制台报错/截图
      description: 可粘贴 Console 错误或拖入截图
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已经搜索过已有 Issue
          required: true
        - label: 我使用的是最新版本/最新 main 分支
          required: true
