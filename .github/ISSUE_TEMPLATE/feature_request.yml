name: Feature request
description: 提出功能、UI 或规则改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **规则已冻结。** 涉及规则/平衡性的改动请先描述问题和目标，不要直接提交规则代码。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 先描述使用场景，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - UI/交互
        - AI
        - 规则/平衡（需先讨论）
        - 文档/构建
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案/取舍
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我理解规则改动需要先讨论
          required: true
        - label: 我已经搜索过已有 Issue
          required: true
